name: Build Part 6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rag-authoring-starter/specs/part06-content-protection/**'
      - '.github/workflows/build-part6.yml'

jobs:
  build-part6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bikeshed and PDF converter
        run: |
          python -m pip install --upgrade pip
          python -m pip install bikeshed weasyprint
          bikeshed update

      - name: Install DASH-IF boilerplate (dashif group)
        working-directory: rag-authoring-starter
        run: python tools/env/install_dashif_boilerplate.py

      - name: Build all specs
        working-directory: rag-authoring-starter
        run: python tools/publication/build_all.py --out ../dist

      - name: Render PDFs from built HTML
        shell: bash
        run: |
          mkdir -p dist-pdf
          for html in dist/*.html; do
            base=$(basename "$html" .html)
            python -m weasyprint "$html" "dist-pdf/${base}.pdf"
          done

      - name: Collect Part 6 output
        shell: bash
        run: |
          mkdir -p dist-part6
          cp dist/part06-content-protection.html dist-part6/
          cp dist-pdf/part06-content-protection.pdf dist-part6/

      - name: Upload Part 6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: part6-dist
          path: dist-part6