# DASH feature inventory seed for IOP v5.
#
# This registry is editorial and intentionally incomplete. It is used to align
# IOPv5 parts, DASH-IF-IOP extensions, dash.js client support, livesim2 content
# generation support, and executable examples.

version: 1
status: seed
sources:
  dashjs_samples: https://reference.dashif.org/dash.js/latest/samples/samples.json
  livesim2_readme: https://github.com/Dash-Industry-Forum/livesim2
  dash_if_iop: https://github.com/Dash-Industry-Forum/DASH-IF-IOP

features:
