    status: draft
    category: low-latency
    granularity: feature
    defined_by:
      iopv5_parts: [part04-live-low-latency]
      dash_if_iop: []
      external_specs: [ISO/IEC 23009-1, CMAF]
    signalling:
      mpd:
        elements: [ServiceDescription, Latency, ProducerReferenceTime, UTCTiming, SegmentTemplate, Resync]
        attributes: [Latency@target, SegmentTemplate@availabilityTimeOffset, SegmentTemplate@availabilityTimeComplete]
        descriptors: []
      inband:
        boxes: [prft]
        events: []
      http:
        headers: []
        query_parameters: []
    content_offering:
      requirements:
        - ServiceDescription present for DASH-IF Low-Latency Service Offering.
        - Latency@target present in milliseconds.
      recommendations: []
    client:
      requirements:
        - Consume low-latency content with multiple moof/mdat pairs per Segment.
      recommendations:
        - Use service latency information to control live-edge playback.
    dashjs:
      support_status: supported
      samples:
        - section: Live Low Latency
          title: Low latency testplayer
        - section: Live
          title: Synchronized live playback with the catchup mode
      settings:
        - streaming.liveCatchup.enabled
        - streaming.delay.liveDelay
      apis: []
      caveats: []
    livesim2:
      support_status: supported
      url_parameters: [chunkdur, ato, ltgt, utc_direct, segtimeline_1]
      examples: [part04-ll-basic, part04-ll-ultra, part04-ll-segtimeline, part04-ll-utc]
      caveats: [ltgt values are integer milliseconds.]
    examples:
