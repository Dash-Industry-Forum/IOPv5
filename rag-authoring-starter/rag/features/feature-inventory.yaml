      iopv5_parts: [part04-live-low-latency]
      dash_if_iop: []
      external_specs: [ISO/IEC 23009-1]
    signalling:
      mpd:
        elements: [MPD, UTCTiming, SegmentTemplate]
        attributes: [MPD@type, MPD@availabilityStartTime, MPD@minimumUpdatePeriod, MPD@timeShiftBufferDepth]
        descriptors: []
      inband:
        boxes: []
        events: []
      http:
        headers: []
        query_parameters: []
    content_offering:
      requirements: []
      recommendations: []
    client:
      requirements: []
      recommendations: []
    dashjs:
      support_status: supported
      samples:
        - section: Live
          title: Live delay comparison custom manifest
        - section: Live
          title: Synchronized live playback with the catchup mode
      settings:
        - streaming.delay.liveDelay
        - streaming.liveCatchup.enabled
      apis:
        - setLiveDelay
      caveats: []
    livesim2:
      support_status: supported
      url_parameters: []
      examples: [part04-ll-basic]
      caveats: [Generated from looped VoD assets as wall-clock synchronized live streams.]
    examples:
      executable: [part04-ll-basic, part04-ll-ultra, part04-ll-segtimeline, part04-ll-utc]
      snippets: []
    validation:
      mpd_observable: true
      player_observable: true
      requires_drm: false
      requires_custom_app: false
    notes: []

